name: Release

# 打 tag 产出可交付的 App 资源包。
#
# ⚠️ 与 admin-web 不同：App **不部署到服务器**，也不在这里产出 APK/IPA。
#    App 的安装包由 DCloud 云打包产出（需要 DCloud 账号与证书，CI 里拿不到），
#    本流水线只负责：门禁校验 → 构建资源包 → 打包成 artifact，
#    供人工下载后导入 HBuilderX 云打包。流程见 DEPLOY.md。
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: '手动触发时的版本号（留空则用当前 ref）'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # 门禁：复用 CI 的同一套校验，通过后才产出交付包。
  verify:
    name: 测试门禁
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    secrets: inherit

  package:
    name: 打包 App 资源
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      RELEASE_VERSION: ${{ inputs.version || github.ref_name }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 环境文件校验
        run: npm run check:env

      - name: 构建 App 资源
        run: npm run build:app

      # 打成 zip，HBuilderX「导入」时选这个包即可（不导入 dist/build/app 目录，
      # 目录导入在 HBuilderX 里对 .gitignore 过的产物目录容易出问题）。
      - name: 打包资源
        run: |
          set -eu
          cd dist/build
          zip -r "idoltrail-app-${RELEASE_VERSION}.zip" app
          cd -
          cp "dist/build/idoltrail-app-${RELEASE_VERSION}.zip" .
          ls -l "idoltrail-app-${RELEASE_VERSION}.zip"

      - name: 生成版本信息
        run: |
          {
            echo "version: $RELEASE_VERSION"
            echo "commit: ${{ github.sha }}"
            echo "built_at: $(date -Is)"
            echo "appid: __UNI__F1F9279"
          } > release-info.txt
          cat release-info.txt

      - name: 上传交付包
        uses: actions/upload-artifact@v4
        with:
          name: idoltrail-app-${{ github.ref_name }}
          path: |
            idoltrail-app-*.zip
            release-info.txt
          retention-days: 30

      - name: 发布说明
        if: always()
        run: |
          echo "版本   : $RELEASE_VERSION"
          echo "提交   : ${{ github.sha }}"
          echo "产物   : idoltrail-app-${RELEASE_VERSION}.zip"
          echo "下一步 : 下载 artifact → HBuilderX 导入 → 云打包（Android APK/AAB、iOS IPA）"
