name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: '试运行版本号（如 v0.1.3），只产出 APK，不同步后台'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: 测试门禁
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: HBuilder 云打包 / 发布 Android
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ inputs.version || github.ref_name }}
      APP_API_BASE_URL: https://api.idoltrail.com/api/v1
      HBUILDERX_VERSION: 5.34.2026102909
      UNI_CLI_CONTEXT: ${{ github.workspace }}
      NODE_PATH: ${{ github.workspace }}/node_modules
      EXPECTED_APK_CERT_SHA256: 21:3D:55:6F:54:FF:7F:D3:05:0B:95:1D:AF:97:8D:22:8A:AE:65:27:55:98:92:AF:B7:5A:D9:BE:D7:A0:76:99

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装系统工具
        run: |
          set -eu
          sudo apt-get -o Acquire::Retries=5 update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=5 \
            --fix-missing install -y --no-install-recommends aapt apksigner

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 安装依赖
        run: |
          npm ci
          node -e "console.log(require.resolve('@dcloudio/uni-uts-v1', { paths: [process.env.UNI_CLI_CONTEXT] }))"

      - name: 从 tag 写入 App 版本
        id: version
        run: node scripts/ci/set-release-version.mjs "$RELEASE_TAG"

      - name: 安装 HBuilderX CLI
        run: |
          set -eu
          archive="$RUNNER_TEMP/hbuilderx.tar.gz"
          install_dir="$RUNNER_TEMP/hbuilderx"
          curl --fail --location --retry 3 \
            "https://download1.dcloud.net.cn/download/HBuilderX.${HBUILDERX_VERSION}.linux_x64.full.tar.gz" \
            --output "$archive"
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" --strip-components=1
          "$install_dir/cli" ver

      - name: 准备 Android 签名证书
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -eu
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/idoltrail.jks"
          test -s "$RUNNER_TEMP/idoltrail.jks"
          echo "APK_KEYSTORE=$RUNNER_TEMP/idoltrail.jks" >> "$GITHUB_ENV"

      - name: 启动并检查 HBuilderX
        run: |
          set -eu
          cli="$RUNNER_TEMP/hbuilderx/cli"
          log="$RUNNER_TEMP/hbuilder-open.log"
          "$cli" open > "$log" 2>&1
          cat "$log"
          ready=false
          for i in $(seq 1 15); do
            if "$cli" project list >> "$log" 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done
          ps -ef | awk '/[H]BuilderX/ { print }' | tee -a "$log"
          if [ "$ready" != "true" ]; then
            cat "$log"
            echo "HBuilderX 启动后 30 秒仍不就绪" >&2
            exit 1
          fi

      - name: 登录 DCloud 并导入项目
        env:
          DCLOUD_USERNAME: ${{ secrets.DCLOUD_USERNAME }}
          DCLOUD_PASSWORD: ${{ secrets.DCLOUD_PASSWORD }}
        run: |
          set -eu
          cli="$RUNNER_TEMP/hbuilderx/cli"
          "$cli" user login --username "$DCLOUD_USERNAME" --password "$DCLOUD_PASSWORD"
          "$cli" project open --path "$GITHUB_WORKSPACE"

      - name: HBuilder CLI 云打包 APK
        env:
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          ANDROID_KEYSTORE_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_KEY_PASSWORD }}
          ANDROID_KEYSTORE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_STORE_PASSWORD }}
        run: |
          set -eu
          log="$RUNNER_TEMP/hbuilder-pack.log"
          "$RUNNER_TEMP/hbuilderx/cli" pack \
            --project "$GITHUB_WORKSPACE" \
            --platform android \
            --safemode false \
            --android.packagename com.idoltrail.app \
            --android.androidpacktype 0 \
            --android.certalias "$ANDROID_KEYSTORE_ALIAS" \
            --android.certfile "$APK_KEYSTORE" \
            --android.certpassword "$ANDROID_KEYSTORE_KEY_PASSWORD" \
            --android.storepassword "$ANDROID_KEYSTORE_STORE_PASSWORD" 2>&1 | tee "$log"

      - name: 读取 DCloud 临时下载地址
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const raw = fs.readFileSync(process.env.RUNNER_TEMP + '/hbuilder-pack.log', 'utf8')
          const log = raw.replace(/\x1b\[[0-9;]*m/g, '')
          if (/Compiling failed|compilation failed|编译失败/i.test(log)) {
            throw new Error('HBuilder 项目编译失败，未生成 APK；请查看打包日志')
          }
          const urls = log.match(/https:\/\/service\.dcloud\.net\.cn\/build\/download\/[A-Za-z0-9-]+/g) || []
          if (!urls.length) {
            console.error(raw)
            throw new Error('云打包日志中没有 APK 下载地址；完整日志已输出并会作为 artifact 保存')
          }
          fs.appendFileSync(process.env.GITHUB_ENV, `DCLOUD_APK_URL=${urls.at(-1)}\n`)
          NODE

      - name: 上传云打包日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hbuilder-pack-${{ env.RELEASE_VERSION || github.ref_name }}.log
          path: |
            ${{ runner.temp }}/hbuilder-open.log
            ${{ runner.temp }}/hbuilder-pack.log
          retention-days: 14

      - name: 下载并校验 APK
        env:
          APK_PATH: ${{ runner.temp }}/idoltrail-app.apk
        run: |
          set -eu
          curl --fail --location --retry 3 "$DCLOUD_APK_URL" --output "$APK_PATH"
          test -s "$APK_PATH"
          badging=$(aapt dump badging "$APK_PATH")
          echo "$badging" | grep -q "package: name='com.idoltrail.app'"
          echo "$badging" | grep -q "versionCode='$RELEASE_VERSION_CODE'"
          echo "$badging" | grep -q "versionName='$RELEASE_VERSION'"
          certs=$(apksigner verify --print-certs "$APK_PATH")
          actual=$(echo "$certs" | awk -F': ' '/SHA-256 digest/ { print $2; exit }' | tr -d ':' | tr 'A-F' 'a-f')
          expected=$(echo "$EXPECTED_APK_CERT_SHA256" | tr -d ':' | tr 'A-F' 'a-f')
          test -n "$actual"
          test "$actual" = "$expected"
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

      - name: 上传 APK 到 OSS
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_PUBLIC_URL: ${{ secrets.OSS_PUBLIC_URL }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          set -eu
          oss="$RUNNER_TEMP/ossutil"
          config="$RUNNER_TEMP/ossutilconfig"
          curl --fail --location --retry 3 \
            https://gosspublic.alicdn.com/ossutil/1.7.19/ossutil64 --output "$oss"
          chmod +x "$oss"
          "$oss" config -c "$config" -e "$OSS_ENDPOINT" \
            -i "$OSS_ACCESS_KEY_ID" -k "$OSS_ACCESS_KEY_SECRET" -L CH
          object="app-releases/idoltrail-app-${RELEASE_VERSION}.apk"
          "$oss" cp "$APK_PATH" "oss://${OSS_BUCKET}/${object}" -c "$config" -f
          url="${OSS_PUBLIC_URL%/}/${object}"
          curl --fail --location --head "$url" > /dev/null
          echo "APK_DOWNLOAD_URL=$url" >> "$GITHUB_ENV"
          stat -c "APK_FILE_SIZE=%s" "$APK_PATH" >> "$GITHUB_ENV"

      - name: 同步后台当前版本
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          APP_VERSION_ACCESS_KEY: ${{ secrets.APP_VERSION_ACCESS_KEY }}
        run: node scripts/ci/sync-app-version.mjs

      - name: 生成发布信息
        run: |
          sha256sum "$APK_PATH" > release-info.txt
          {
            echo "version: $RELEASE_VERSION"
            echo "version_code: $RELEASE_VERSION_CODE"
            echo "commit: $GITHUB_SHA"
            echo "download_url: ${APK_DOWNLOAD_URL:-未发布（手动试运行）}"
          } >> release-info.txt

      - name: 上传 APK 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: idoltrail-app-${{ env.RELEASE_VERSION }}-apk
          path: |
            ${{ runner.temp }}/idoltrail-app.apk
            release-info.txt
          retention-days: 14

      - name: 创建 GitHub Release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: idoltrail-app ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ${{ runner.temp }}/idoltrail-app.apk
            release-info.txt
